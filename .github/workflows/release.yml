name: Release

on:
  push:
    # Semver-shaped tags only (v1.2.3, v1.2.3-rc.1); `v*` would also match
    # stray tags such as "vtest".
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# Nothing by default; each job states exactly what it needs.
permissions: {}

# Never cancel a release half-way; a second push of the same tag waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with GORELEASER_VERSION in ci.yml.
  GORELEASER_VERSION: v2.20.3

jobs:
  # The full CI suite for the tagged commit. A failure here means nothing is
  # published; delete the tag, fix, and re-tag.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser needs the full history and tags for the changelog.
          fetch-depth: 0
          # GoReleaser talks to the API with GITHUB_TOKEN; git itself never
          # needs the credential.
          persist-credentials: false

      # Releases are cut from master only. The tag must point at a commit
      # that is already on master (fetch-depth: 0 makes origin/master exist).
      - name: Check tagged commit is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on master"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Fails before anything is published if VCS stamping would not yield
      # exactly the tag (e.g. a dirty tree or a pseudo-version). Built
      # outside the checkout so the tree stays clean for GoReleaser.
      - name: Check binary reports the tag
        run: |
          go build -trimpath -o "$RUNNER_TEMP/drydock" ./cmd/drydock
          got="$("$RUNNER_TEMP/drydock" -version)"
          want="drydock $GITHUB_REF_NAME"
          echo "$got"
          if [ "$got" != "$want" ]; then
            echo "::error::version mismatch: got '$got', want '$want'"
            exit 1
          fi

      - name: goreleaser release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The published artifact itself, as a last check.
      - name: Check released binary reports the tag
        run: |
          bin="$(find dist -type f -path '*_linux_amd64*/drydock' | head -n 1)"
          got="$("$bin" -version)"
          echo "$got"
          if [ "$got" != "drydock $GITHUB_REF_NAME" ]; then
            echo "::error::released binary reports '$got'"
            exit 1
          fi
